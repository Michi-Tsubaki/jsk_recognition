[project]
name = "yolo-3d-ros"
version = "0.1.1"
description = "Python dependencies for yolo_3d_ros"
maintainers = [
  { name = "Michitoshi Tsubaki", email = "tsubaki@jsk.t.u-tokyo.ac.jp" },
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5,!=4.13.0.90",
  "ultralytics==8.4.114",
]

[dependency-groups]
test = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5,!=4.13.0.90",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["test"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "install", "log"]
extend-include = [
  "scripts/yolo_3d_node",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
