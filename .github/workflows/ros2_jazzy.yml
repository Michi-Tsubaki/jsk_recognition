name: ROS 2 Jazzy CI

on:
  push:
    branches:
      - ros2
  pull_request:
    branches:
      - ros2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  industrial_ci:
    name: Jazzy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          ROS_REPO: main
          UPSTREAM_WORKSPACE: yolo_3d_ros/jazzy.repos
          ADDITIONAL_DEBS: >-
            curl
            python3-pip
            python3-venv
          PIP_BREAK_SYSTEM_PACKAGES: "1"
          AFTER_SETUP_TARGET_WORKSPACE_EMBED: >-
            python3 -m pip install --user uv &&
            export PATH="$HOME/.local/bin:$PATH" &&
            uv --version
          TARGET_CMAKE_ARGS: >-
            -DBUILD_TESTING=ON
            -DYOLO_3D_DOWNLOAD_MODEL=ON
          CLANG_FORMAT_CHECK: none
          CLANG_TIDY: none
          PYLINT_CHECK: "false"
          BLACK_CHECK: "false"
          IMMEDIATE_TEST_OUTPUT: "true"
